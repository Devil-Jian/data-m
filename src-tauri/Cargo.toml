[package]
name = "paper-archive"
version = "0.2.0"
description = "Local research paper and raw data archive"
authors = ["Devil-Jian"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "paper_archive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
hex = "0.4.3"
sha2 = "0.10.9"
thiserror = "2.0.17"
uuid = { version = "1.29.0", features = ["v7"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8.4"

[dev-dependencies]
tempfile = "3.27.0"

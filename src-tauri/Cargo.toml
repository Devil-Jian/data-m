[package]
name = "paper-archive"
version = "0.1.0"
description = "Local research paper and raw data archive"
authors = ["Devil-Jian"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "paper_archive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8.4"

[dev-dependencies]
tempfile = "3.27.0"

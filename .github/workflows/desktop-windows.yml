name: Windows desktop shell
on:
  push:
    branches:
      - feat/tauri2-desktop-shell
      - chore/s0-development-baseline
      - feat/s4-real-asset-browser
      - feat/s5-asset-link-copy-move
      - feat/s6-rename-recycle
      - feat/s7-integrity-backup-restore
      - feat/s8-statistics-sample-inclusion
      - feat/i1-s8-s9-integration
      - feat/s10-bidirectional-trace-export
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'demos/shadcn/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright*.config.ts'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'demos/shadcn/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright*.config.ts'
      - '.github/workflows/desktop-windows.yml'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Rust fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Export rustfmt corrections on failure
        if: failure()
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          git diff --output=rustfmt.patch
      - name: Upload rustfmt corrections
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: s1-rustfmt-corrections
          path: rustfmt.patch
          if-no-files-found: warn
      - name: Install packages
        run: npm ci --no-audit --no-fund
      - name: S0 baseline contracts
        run: npm run test:s0
      - name: Type-check, Vite build and interaction tests
        run: |
          npm run build:desktop
          npm run test:interaction
          npm run test:assets
          npm run test:desktop
      - name: Verify Windows source-protection fixture checker (non-GUI)
        run: ./scripts/test-p1-drop-source.ps1 -SelfTest
      - name: Install Chromium for Windows interaction tests
        run: npx playwright install chromium
      - name: Windows Chromium pointer and keyboard E2E
        run: npm run test:e2e
      - name: S0 renderer consistency
        run: npm run test:e2e:desktop -- --grep "@S0"
      - name: Desktop renderer CSS and keyboard E2E (port 5176)
        run: npm run test:e2e:desktop
      - name: S1 project tree browser mock E2E
        run: npm run test:e2e:desktop -- --grep "@S1"
      - name: S2 experiment structure browser mock E2E
        run: npm run test:e2e:desktop -- --grep "@S2"
      - name: S3 import workflow browser mock E2E
        run: npm run test:e2e:desktop -- --grep "@S3"
      - name: S4 real asset browsing browser regression
        run: npm run test:e2e:desktop -- --grep "@S4"
      - name: S5 real workspace transfer browser flows (explicit renderer mock)
        run: npm run test:e2e:desktop -- --grep "@S5"
      - name: S8 statistics workspace browser flows (explicit renderer mock)
        run: npm run test:e2e:desktop -- --grep "@S8"
      - name: S7 safety workbench browser flows (explicit renderer mock)
        run: npm run test:e2e:desktop -- --grep "@S7"
      - name: S9 paper workspace UI E2E
        run: npm run test:e2e:desktop -- --grep "@S9"
      - name: S10 provenance UI E2E (explicit renderer IPC mock)
        run: npm run test:e2e:desktop -- --grep "@S10"
      - name: I1 integrated workspace UI E2E
        run: npm run test:e2e:desktop -- --grep "@I1"
      - name: S9 native SQLite paper and pinned-version regression
        working-directory: apps/desktop/src-tauri
        run: |
          $discovered = cargo test --locked --no-default-features s9_ -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($discovered -match 's9_.*: test$')) { throw 'S9 native tests not discovered' }
          cargo test --locked --no-default-features s9_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: I1 native integrated schema and repository regression
        working-directory: apps/desktop/src-tauri
        run: |
          $discovered = cargo test --locked --no-default-features i1_ -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: S10 native exact-version provenance tests
        working-directory: apps/desktop/src-tauri
        run: |
          $discovered = cargo test --locked --no-default-features s10_ -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($discovered -match 's10_.*: test

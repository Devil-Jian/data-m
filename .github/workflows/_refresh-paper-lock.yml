name: Update paper workspace npm lockfile once

on:
  push:
    branches:
      - feat/archive-foundation
    paths:
      - .github/workflows/_refresh-paper-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve npm dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit npm lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: lock PDF and DOCX preview dependencies"
            git push origin HEAD:feat/archive-foundation
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

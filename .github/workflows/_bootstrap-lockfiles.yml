name: Bootstrap dependency lockfiles

on:
  push:
    branches:
      - feat/archive-foundation
    paths:
      - .github/workflows/_bootstrap-lockfiles.yml

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit lockfiles
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: commit reproducible npm and Cargo dependency locks"
            git push origin HEAD:feat/archive-foundation
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run focused ArchiveStore contract test
        run: cargo test --manifest-path src-tauri/Cargo.toml archive::store::tests::opens_archive_and_keeps_archive_id_stable -- --exact

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build frontend
        run: npm run build

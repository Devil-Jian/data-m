name: Bootstrap v0.4 formatting and lockfiles
on:
  push:
    branches:
      - feat/archive-foundation
    paths:
      - .github/workflows/_bootstrap-v04.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format Rust and lock dependencies
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit normalization
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src src-tauri/Cargo.lock package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "style: format archive workflow and lock v0.4.0 dependencies"
            git fetch origin feat/archive-foundation
            git rebase FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { exit 1 }
            git push origin HEAD:feat/archive-foundation
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

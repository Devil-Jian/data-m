name: Native WinUI .NET 10

on:
  push:
    branches:
      - feat/winui-native
    paths:
      - native/**
      - .github/workflows/native-winui.yml
      - src-tauri/migrations/**
  workflow_dispatch:

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build C# archive core
        run: dotnet build native/PaperArchive.Core/PaperArchive.Core.csproj -c Release
      - name: Legacy database and import tests
        run: dotnet run --project native/PaperArchive.Core.SmokeTests/PaperArchive.Core.SmokeTests.csproj -c Release
      - name: Build WinUI 3
        run: dotnet build native/PaperArchive.Native/PaperArchive.Native.csproj -c Release -p:Platform=x64
      - name: Publish unpackaged WinUI application
        run: dotnet publish native/PaperArchive.Native/PaperArchive.Native.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o native-dist
      - name: Bundle Windows build output
        shell: pwsh
        run: |
          Compress-Archive -Path native-dist\* -DestinationPath PaperArchive-WinUI3-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PaperArchive-WinUI3-x64
          path: PaperArchive-WinUI3-x64.zip
          if-no-files-found: error

name: Format and lock paper workspace once

on:
  push:
    branches:
      - feat/archive-foundation
    paths:
      - .github/workflows/_paper-fmt-lock.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Regenerate Cargo.lock for v0.2
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting and lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "style: format paper services and lock v0.2 Rust dependencies"
            git push origin HEAD:feat/archive-foundation
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

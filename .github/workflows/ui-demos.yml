name: Build UI demo variants
on:
  push:
    branches: [feat/ui-framework-comparison, feat/file-interaction-engine]
  pull_request:
    paths:
      - 'demos/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright*.config.ts'
      - '.github/workflows/ui-demos.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [shadcn, mantine, fluent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: npm ci --no-audit --no-fund
      - name: Test interaction engine
        run: npm run test:interaction
      - name: Test asset identity invariants
        run: npm run test:assets
      - name: Build ${{ matrix.variant }} demo
        run: npm run build:${{ matrix.variant }}

  interaction-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interaction E2E
        run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-playwright-traces
          path: test-results/
          retention-days: 7


  s9-find-windows:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Identify Windows S9 builds for validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo Devil-Jian/data-m --workflow desktop-windows.yml --branch feat/s9-paper-figure-panel --limit 4 --json databaseId,headSha,status,conclusion,url
          gh run view 44001481464 --repo Devil-Jian/data-m --json jobs --jq '.jobs[] | {databaseId,name,conclusion,steps:[.steps[] | select(.conclusion=="failure") | .name]}'
          gh run view 44001481464 --repo Devil-Jian/data-m --log-failed | grep -E 'error\[|error:|Diff in|S9|FAILED|failed|Process completed|Expected|found|TS[0-9]{4}' | head -n 120 || true
